# customers.*.feeds is intentionally empty here -- a later task (feed discovery)
# fills rss/edgar/ir_page feeds per entity once each candidate feed is verified.
#
# topics.* keys are watchlist domains (see DOMAINS in src/services/watchlist-config.ts)
# except the literal "none" key: those are the pharma business/science/pipeline and
# supply-chain-geopolitics strings from the old SEARCH_TOPICS list that fit no domain
# in the closed set. No topic string from SEARCH_TOPICS was dropped in this move; every
# one lives under topics.cyber, topics.storage, topics.ai, topics.cloud, topics.data,
# topics.infrastructure, topics.sap or topics.none.

