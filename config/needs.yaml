# Which segments address which customer need.
#
# This is the hinge of the whole query: an account declares needs, and this maps
# them to the segments where a conversation is worth having. Get it wrong and
# the system recommends the wrong part of the portfolio with full confidence.
#
# PROPOSED 2026-09-21, for Seb to correct — these are reasoned, not researched.
# Both keys and values are validated against the closed sets in graph-schema.ts.
#
# KNOWN FLAW, found against real data 2026-09-21: this map can hide an incumbent
# we already know about. Novartis runs HDS in storage-block, but its declared
# needs (manufacturing-ot, gxp-compliance, rnd-compute, cost-optimisation) reach
# storage-block through none of them — block is gated behind cyber-resilience
# and data-sovereignty only. The incumbent is in the graph and invisible to the
# query. Either that account's needs are incomplete (every large pharma
# plausibly has cyber-resilience) or this mapping is too narrow. Not widened
# unilaterally: a wrong edge here changes which segments every answer covers.

needs:
  rnd-compute:
    # Discovery: cryo-EM, sequencing, molecular dynamics. Compute plus the file
    # tier those pipelines actually stall on.
    - compute-ai
    - compute-standard
    - storage-file

  ai-factory:
    # Training and inference at scale: GPUs, a parallel filesystem, and the
    # fabric between them.
    - compute-ai
    - storage-file
    - networking

  gxp-compliance:
    # Validated estates and regulated records: retention, immutability, and the
    # services that keep validation current.
    - data-protection
    - storage-object
    - services

  cyber-resilience:
    # Detection on primary storage plus an air-gapped, immutable recovery path.
    - data-protection
    - storage-block
    - storage-file

  data-sovereignty:
    # Customer-owned, customer-sited, no foreign operator in the control path.
    - storage-object
    - storage-block
    - services

  manufacturing-ot:
    # MES, LIMS and SCADA at plant sites: small resilient clusters, pinned
    # hypervisors, segmented networks.
    - hci
    - compute-standard
    - networking

  ai-data-platform:
    # The analytics layer over research and manufacturing data: object as the
    # substrate, file where pipelines land, services to assemble it.
    - storage-object
    - storage-file
    - services

  end-user-computing:
    # Devices, the workplace estate around them, and the refresh that funds it.
    - client
    - services

  multi-cloud:
    # Where data sits, what it costs to move, and the fabric reaching it.
    - storage-object
    - networking
    - services

  sap:
    # S/4HANA is latency-bound and sits on certified compute with fast block
    # underneath; the migration itself is a services engagement.
    - compute-standard
    - storage-block
    - services

  cost-optimisation:
    - services
    - storage-object
    - client

  sustainability:
    - compute-standard
    - services
